# Barreiras de segurança (21/10/2026, após o incidente do Railway e o repositório público com .env e CPF).
# Roda em todo pull request e em push na main. Qualquer falha aqui bloqueia o PR.
name: Segurança

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dados-sensiveis:
    name: Segredos e dados pessoais (CPF/CNS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # precisa do histórico para comparar com a base do PR
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Testes do verificador
        run: pytest -q scripts/seguranca/test_verificar_dados_sensiveis.py
      - name: Linhas adicionadas no PR
        if: github.event_name == 'pull_request'
        run: python scripts/seguranca/verificar_dados_sensiveis.py --base "origin/${{ github.base_ref }}"
      - name: Repositório inteiro (push na main)
        if: github.event_name == 'push'
        run: python scripts/seguranca/verificar_dados_sensiveis.py --todos

  dependencias:
    name: Dependências com falha conhecida
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Python (backend)
        # Exceções revisadas em 21/10/2026 — sem versão corrigida publicada e sem exposição no ERSUS360:
        #   PYSEC-2026-4298 (python-jose): exige algoritmo não restringido; auth.py decodifica com
        #                   algorithms=[HS256] e chave secreta simétrica. Plano: migrar para PyJWT.
        #   PYSEC-2026-1325 (ecdsa, dependência do python-jose): o sistema não assina com ECDSA.
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Frontend (dependências de produção, alto e crítico)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
